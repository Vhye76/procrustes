name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: build
  cancel-in-progress: false

jobs:
#----- Code validation only, no behaviour is exercised here
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.x"
      - name: The two modules the image installs from Alpine
        run: pip install argon2-cffi qrcode
      - name: Every module parses
        run: python3 -m compileall -q app
      - name: The package imports
        run: python3 -c "import app.main"
      - name: Every name a function loads is defined
        run: python3 -m app.check_names
#----- The version names the image and its label
      - name: The version
        id: version
        run: |
          version="$(python3 -c 'from app import VERSION; print(VERSION)')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

#----- Build and publish to GHCR
  image:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Whether the version tag is already published
        id: published
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          #----- GHCR takes the base64 of GITHUB_TOKEN as its bearer token
          #----- without the index types in Accept, GHCR answers 404 for a published multi-platform tag
          code="$(curl -sS -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $(printf '%s' "$TOKEN" | base64 -w0)" \
            -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json, application/vnd.oci.image.manifest.v1+json, application/vnd.docker.distribution.manifest.v2+json' \
            "https://ghcr.io/v2/$owner/procrustes/manifests/$VERSION")"
          case "$code" in
            200) echo "absent=false" >> "$GITHUB_OUTPUT"; echo "::notice::$VERSION is already published, the version tag is left where it is" ;;
            404) echo "absent=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::GHCR answered $code for $VERSION"; exit 1 ;;
          esac
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/procrustes
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ needs.validate.outputs.version }},enable=${{ steps.published.outputs.absent }}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ needs.validate.outputs.version }}
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
