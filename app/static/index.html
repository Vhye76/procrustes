<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>procrustes</title>
<link rel="icon" type="image/png" href="/favicon.ico">
<style>
  /*----- Palette */
  :root {
    --bg: #14161a; --panel: #1c1f26; --line: #2c313b;
    --ink: #e7eaf0; --dim: #98a2b3; --accent: #6ea8fe;
    --ok: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, sans-serif;
         display: flex; flex-direction: column; }
  header { padding: 14px 24px; border-bottom: 1px solid var(--line);
           display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap; flex: 0 0 auto; }
  h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .02em; }
  .pill { font-size: 12px; padding: 2px 8px; border-radius: 99px;
          border: 1px solid var(--line); color: var(--dim); }
  .pill.ok { color: var(--ok); border-color: #235b3a; }
  .pill.bad { color: var(--bad); border-color: #5b2323; }
  .pill.warn { color: var(--warn); border-color: #5b4a23; }

  /*----- The menu */
  #menu { margin-left: auto; position: relative; align-self: center; }
  #menu-btn { background: none; border: 1px solid transparent; border-radius: 6px;
              padding: 3px 5px; color: var(--ink); cursor: pointer; display: flex; }
  #menu-btn:hover, #menu-btn[aria-expanded="true"] { color: var(--accent); border-color: var(--line); }
  #menu-btn svg { width: 26px; height: 26px; display: block; }
  #menu-list { display: none; position: absolute; right: 0; top: calc(100% + 6px); z-index: 20;
               min-width: 240px; background: var(--panel); border: 1px solid var(--line);
               border-radius: 8px; padding: 6px 0; box-shadow: 0 8px 24px rgba(0,0,0,.45); }
  #menu-list.open { display: block; }
  #menu-list .st { padding: 6px 14px; font-size: 12px; color: var(--dim); white-space: nowrap; }
  #menu-list .st.ok { color: var(--ok); }
  #menu-list .st.warn { color: var(--warn); }
  #menu-list hr { border: none; border-top: 1px solid var(--line); margin: 6px 0; }
  #menu-list a { display: block; padding: 7px 14px; font-size: 13px; color: var(--ink);
                 text-decoration: none; }
  #menu-list a:hover { background: #232833; color: var(--accent); }

  /*----- The flow */
  main { flex: 1 1 auto; min-height: 0; padding: 20px 24px 8px;
         display: grid; gap: 0 14px;
         grid-template-columns: 540px 54px minmax(0,1fr) 54px minmax(0,1fr);
         grid-template-rows: minmax(0,1fr) minmax(0,1fr); }
  .box { background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
         display: flex; flex-direction: column; min-height: 0; margin-bottom: 14px; }
  .box h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em;
            color: var(--dim); margin: 0; padding: 11px 14px; font-weight: 600;
            border-bottom: 1px solid var(--line);
            display: flex; justify-content: space-between; align-items: baseline; }
  .box h2 .n { font-size: 18px; color: var(--ink); font-weight: 600; letter-spacing: 0; }
  .box .fill { flex: 1 1 auto; overflow-y: auto; padding: 12px 14px; min-height: 0; }

  #b-queue  { grid-column: 1; grid-row: 1 / span 2; }
  #a-enc    { grid-column: 2; grid-row: 1; }
  #b-enc    { grid-column: 3; grid-row: 1; }
  #a-held   { grid-column: 2; grid-row: 2; }
  #b-held   { grid-column: 3; grid-row: 2; }
  #a-ready  { grid-column: 4; grid-row: 1; }
  #b-ready  { grid-column: 5; grid-row: 1; }
  #corner   { grid-column: 5; grid-row: 2; display: flex; flex-direction: column;
              align-items: flex-end; justify-content: flex-end; gap: 6px;
              padding: 0 4px 18px 0; }

  .arrow { display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 4px; color: var(--line);
           font-size: 26px; line-height: 1; margin-bottom: 14px; user-select: none; }

  /*----- Tiles */
  .tiles { display: grid; gap: 12px;
           grid-template-columns: repeat(2, minmax(0, 1fr)); }
  #b-queue .tiles { gap: 10px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .tile { display: flex; gap: 10px; align-items: flex-start; cursor: pointer;
          border: 1px solid transparent; border-radius: 6px; padding: 6px;
          background: #171a20; }
  .tile:hover { border-color: var(--accent); }
  #b-queue .tile { flex-direction: column; gap: 6px; }
  .art { width: 62px; height: 93px; flex: 0 0 auto; border-radius: 4px;
         background: #22262f; border: 1px solid var(--line);
         overflow: hidden; position: relative; }
  #b-queue .art { width: 100%; height: auto; aspect-ratio: 2 / 3; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%;
             object-fit: cover; display: block; }
  .art .ph { position: absolute; inset: 0; display: flex; align-items: center;
             justify-content: center; font-size: 10px; color: var(--dim);
             text-align: center; padding: 4px; word-break: break-word; }
  .tt { min-width: 0; flex: 1 1 auto; }
  .tt .n { font-size: 13px; font-weight: 600; line-height: 1.3;
           overflow-wrap: break-word; }
  #b-queue .tt .n { font-size: 12px; }
  .tt .s { font-size: 11px; color: var(--dim); margin-top: 2px; overflow-wrap: break-word; }
  .tt .s.warn { color: var(--warn); }
  .bar { height: 5px; background: #22262f; border-radius: 99px;
         overflow: hidden; margin-top: 6px; }
  .bar > i { display: block; height: 100%; background: var(--accent); }
  .empty { color: var(--dim); font-style: italic; font-size: 12px; }

  /*----- Queue order */
  .art .pos { position: absolute; top: 4px; left: 4px; z-index: 1; padding: 1px 6px;
              border-radius: 4px; background: rgba(12, 14, 18, .82); color: var(--ink);
              font-size: 11px; font-weight: 600; letter-spacing: .02em;
              font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
  .tile.locked .art .pos { color: var(--accent); }
  .tile.locked { cursor: default; border-color: #2c313c; }
  .tile.locked:hover { border-color: #2c313c; }
  .tile[draggable="true"] { cursor: grab; }
  .tile.dragging { opacity: .35; }

  /*----- Corner counters */
  .counter { font-size: 13px; color: var(--dim); cursor: pointer;
             font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
             padding: 3px 8px; border-radius: 5px; border: 1px solid transparent;
             white-space: nowrap; display: flex; justify-content: space-between;
             gap: 12px; align-self: stretch; }
  .counter:hover { border-color: var(--accent); color: var(--accent); }
  .counter b { color: var(--ink); font-weight: 600; margin-left: auto; }
  a.counter { text-decoration: none; }
  .counter.static { cursor: default; }
  .counter.static:hover { border-color: transparent; color: var(--dim); }

  /*----- Dialogs */
  button { background: #232833; color: var(--ink); border: 1px solid var(--line);
           border-radius: 5px; padding: 5px 11px; font-size: 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); color: var(--accent); }
  button.bad:hover { border-color: var(--bad); color: var(--bad); }
  button:disabled, button:disabled:hover { opacity: .45; cursor: not-allowed;
                                           border-color: var(--line); color: var(--ink); }
  dialog { background: var(--panel); color: var(--ink); border: 1px solid var(--line);
           border-radius: 8px; padding: 0; max-width: 1100px; width: 92vw; }
  dialog::backdrop { background: rgba(0,0,0,.65); }
  dialog h3 { margin: 0; padding: 12px 16px; font-size: 13px; text-transform: uppercase;
              letter-spacing: .08em; color: var(--dim); border-bottom: 1px solid var(--line); }
  .dlg-body { max-height: 66vh; overflow: auto; }
  .dlg-foot { padding: 10px 16px; border-top: 1px solid var(--line);
              display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dlg-foot .acts { display: flex; gap: 8px; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: 8px 16px; border-bottom: 1px solid var(--line);
           font-size: 13px; vertical-align: top; }
  th { color: var(--dim); font-weight: 600; font-size: 11px;
       text-transform: uppercase; letter-spacing: .06em; }
  tr:last-child td { border-bottom: none; }
  .paths { padding: 10px 16px; font-size: 12px; color: var(--dim);
           font-family: ui-monospace, SFMono-Regular, Menlo, monospace; word-break: break-all; }
  .paths div { margin: 2px 0; }
  tr.differs td { background: #1f2229; }
  tr.decided td { background: #1d2a20; }
  td.gate { color: var(--dim); font-size: 11px; white-space: nowrap; }
  td.val { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px;
           word-break: break-all; }
  .tag { font-size: 10px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line);
         color: var(--dim); margin-left: 6px; white-space: nowrap; }
  .tag.decided { color: var(--ok); border-color: #235b3a; }
  .tag.ungated { color: var(--warn); border-color: #5b4a23; }
  .note { padding: 8px 16px; font-size: 12px; color: var(--warn);
          border-bottom: 1px solid var(--line); }
  .det-head { display: flex; gap: 16px; padding: 14px 16px;
              border-bottom: 1px solid var(--line); }
  .det-head .art { width: 92px; height: 138px; }
  .det-head .meta { min-width: 0; }
  .det-head .meta .big { font-size: 17px; font-weight: 600; }
  .det-head .meta .row { font-size: 12px; color: var(--dim); margin-top: 3px;
                         overflow-wrap: anywhere; }
  .det-head .meta .row.warn { color: var(--warn); }
  .idn { border-bottom: 1px solid var(--line); }
  .idn .h { padding: 10px 16px; font-size: 11px; color: var(--dim); text-transform: uppercase;
            letter-spacing: .06em; border-bottom: 1px solid var(--line); }
  .idn .h.src { background: #191c23; }
  .idn label.opt { display: flex; gap: 12px; padding: 8px 16px; flex-wrap: wrap; align-items: center;
                   font-size: 12px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .idn .opt .ttl { font-weight: 600; }
  .idn .opt .ids { color: var(--dim); white-space: pre; }
  .idn .opt .man { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; color: var(--dim); }
  .idn input[type=text] { background: #161a21; color: var(--ink); border: 1px solid var(--line);
                          border-radius: 6px; padding: 4px 8px; font-size: 12px; width: 150px; }
  .idn .go { display: flex; gap: 12px; padding: 10px 16px; align-items: center; font-size: 12px;
             color: var(--dim); }
  .idn .empty { padding: 8px 16px; font-size: 12px; color: var(--dim); }
  .hist { padding: 10px 16px; font-size: 12px; }
  .hist .h { color: var(--dim); text-transform: uppercase; letter-spacing: .06em;
             font-size: 11px; margin-bottom: 6px; }
  .hist div.e { display: flex; gap: 12px; padding: 2px 0; }
  .hist div.e span.t { color: var(--dim); font-family: ui-monospace, Menlo, monospace;
                       flex: 0 0 auto; }
  .lst .row { padding: 10px 16px; border-bottom: 1px solid var(--line);
              display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
  .lst .row:last-child { border-bottom: none; }
  .lst .row .why { font-size: 12px; color: var(--warn); margin-top: 2px; }
  .lst .row > div:first-child { flex: 1 1 0; min-width: 0; overflow-wrap: anywhere; }
  .lst .row .nm { font-size: 13px; font-weight: 600; overflow-wrap: anywhere; }
  .lst .row .btns { display: flex; gap: 6px; flex: 0 0 auto; flex-wrap: nowrap;
                    justify-content: flex-end; }
  .lst .row .btns button { white-space: nowrap; }
  #lst-acts { padding: 10px 16px; border-bottom: 1px solid var(--line);
              display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #lst-acts .lbl { font-size: 11px; color: var(--dim); text-transform: uppercase;
                   letter-spacing: .06em; margin-right: 4px; }
</style>
</head>
<body>
<header>
  <h1>procrustes</h1>
  <span class="pill" id="dry"></span>
  <span class="pill warn" id="authoff" style="display:none">AUTH OFF</span>
  <div id="menu">
    <button id="menu-btn" aria-expanded="false" aria-controls="menu-list" title="Menu">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M4 10.5c0-3.6 3.6-6 8-6s8 2.4 8 6H4z"/>
        <path d="M8.5 7.5h.01M12 6.5h.01M15.5 7.5h.01"/>
        <path d="M3.5 13c1 .8 2 .8 3 0s2-.8 3 0 2 .8 3 0 2-.8 3 0 2 .8 3 0 2-.8 2.5 0"/>
        <rect x="4" y="14.5" width="16" height="2.5" rx="1.25"/>
        <path d="M4.5 18.5h15a1.5 1.5 0 0 1-1.5 1.5H6a1.5 1.5 0 0 1-1.5-1.5z"/>
      </svg>
    </button>
    <div id="menu-list" role="menu">
      <div class="st" id="codec">output</div>
      <div class="st" id="gpu">gpu</div>
      <div class="st" id="encode">encode</div>
      <div class="st" id="libs">libraries</div>
      <hr>
      <a href="/settings" role="menuitem">Application Settings</a>
      <a href="/standards" role="menuitem">Minimum Standards</a>
      <a href="/account" role="menuitem">User Settings</a>
      <a href="#" role="menuitem" id="signout" onclick="signOut(event)">Sign out</a>
    </div>
  </div>
</header>

<main>
  <section class="box" id="b-queue">
    <h2>Queue <span class="n" id="n-queue">0</span></h2>
    <div class="fill"><div class="tiles" id="t-queue"></div></div>
  </section>

  <div class="arrow" id="a-enc">&#8594;</div>

  <section class="box" id="b-enc">
    <h2>Encoding <span class="n" id="n-enc">0</span></h2>
    <div class="fill"><div class="tiles" id="t-enc"></div></div>
  </section>

  <div class="arrow" id="a-held"><span>&#8594;</span><span>&#8592;</span></div>

  <section class="box" id="b-held">
    <h2>Held <span class="n" id="n-held">0</span></h2>
    <div class="fill"><div class="tiles" id="t-held"></div></div>
  </section>

  <div class="arrow" id="a-ready">&#8594;</div>

  <section class="box" id="b-ready">
    <h2>Ready to promote <span class="n" id="n-ready">0</span></h2>
    <div class="fill"><div class="tiles" id="t-ready"></div></div>
  </section>

  <div id="corner">
    <a class="counter" id="c-report" href="/report" style="display:none">Library Quality Report</a>
    <div class="counter static" id="c-scan" style="display:none">Scanning: <b>0/0</b></div>
    <div class="counter" id="c-quar" onclick="showList('QUARANTINED')">Quarantined Files: <b>0</b></div>
    <div class="counter" id="c-fail" onclick="showList('FAILED')">Failed Jobs: <b>0</b></div>
  </div>
</main>

<dialog id="det">
  <h3 id="det-h">Title</h3>
  <div class="det-head" id="det-head"></div>
  <div class="dlg-body" id="det-body"></div>
  <div class="dlg-foot">
    <div class="acts" id="det-acts"></div>
    <button onclick="$('det').close()">Close</button>
  </div>
</dialog>

<dialog id="lst">
  <h3 id="lst-h">List</h3>
  <div id="lst-acts"></div>
  <div class="dlg-body lst" id="lst-body"></div>
  <div class="dlg-foot"><span></span><button onclick="$('lst').close()">Close</button></div>
</dialog>

<dialog id="cmp">
  <h3 id="cmp-title">Comparison</h3>
  <div id="cmp-notes"></div>
  <div class="paths" id="cmp-paths"></div>
  <div class="dlg-body" id="cmp-body"></div>
  <div class="dlg-foot">
    <span class="pill" id="cmp-verdict"></span>
    <button onclick="$('cmp').close()">Close</button>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
//----- A 401 anywhere reloads the page, which then serves the login form
async function api(path, options) {
  const res = await fetch(path, options);
  if (res.status === 401) { location.reload(); throw new Error("login required"); }
  return res;
}
async function signOut(ev) {
  ev.preventDefault();
  try { await fetch("/api/logout", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" }); }
  catch (e) {}
  location.href = "/";
}
//----- The AUTH OFF pill and the Sign out entry follow the switch
function authPill(s) {
  const off = s.auth && s.auth.enabled === false;
  $("authoff").style.display = off ? "" : "none";
  $("signout").style.display = off ? "none" : "";
}
const esc = (v) => String(v == null ? "" : v).replace(/[&<>"']/g,
  (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

const QUEUE_STAGES = ["DETECTED", "PROBED", "SCREENED", "IDENTIFIED", "COMPARED", "ROUTED",
                      "STAGED", "REMUXED", "TAGGED", "READY"];
const ENC_STAGES = ["ENCODING", "ENCODED", "VERIFIED"];
const READY_STAGES = ["PUBLISHED", "CLEANUP"];

let TITLES = {};
let ALL = [];
const SIG = {};
let DRAGGING = null;

function pill(el, text, cls) {
  el.textContent = text;
  el.className = "pill" + (cls ? " " + cls : "");
}
function menuRow(el, text, cls) {
  el.textContent = text;
  el.className = "st" + (cls ? " " + cls : "");
}
function codecText(settings) {
  const oc = (settings && settings.output_codec) || {};
  if (!oc.movie && !oc.tv) return "output unknown";
  return oc.movie === oc.tv ? "output " + oc.movie : `output movies ${oc.movie}, tv ${oc.tv}`;
}

//----- The menu opens on its button and closes on a click elsewhere or Escape
$("menu-btn").addEventListener("click", (ev) => {
  ev.stopPropagation();
  const open = !$("menu-list").classList.contains("open");
  $("menu-list").classList.toggle("open", open);
  $("menu-btn").setAttribute("aria-expanded", open ? "true" : "false");
});
function closeMenu() {
  $("menu-list").classList.remove("open");
  $("menu-btn").setAttribute("aria-expanded", "false");
}
document.addEventListener("click", (ev) => { if (!ev.target.closest("#menu")) closeMenu(); });
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") closeMenu(); });
function gb(n) { return (Number(n || 0) / 1e9).toFixed(2) + " GB"; }
function num(n) { return Number(n).toLocaleString("en-US"); }
function fmtEta(s) {
  if (s < 60) return Math.round(s) + "s";
  const h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60);
  return h ? h + "h " + m + "m" : m + "m";
}
function base(p) { return String(p || "").split("/").pop(); }
function episodeCode(t) {
  const pad = n => String(n).padStart(2, "0");
  let code = "S" + pad(t.season) + "E" + pad(t.episode);
  if (t.episode_last != null && t.episode_last !== t.episode) code += "-E" + pad(t.episode_last);
  return code;
}

function label(t) { return t.title || t.show || base(t.source_path); }

//----- Artwork, with a text placeholder on the same footprint
function art(t, phText, badge) {
  const ph = `<div class="ph">${esc(phText || base(t.source_path))}</div>`;
  const img = t.poster
    ? `<img src="/api/poster/${t.poster}" alt="" loading="lazy"
            onerror="this.style.display='none'">`
    : "";
  const pos = badge ? `<div class="pos">${esc(badge)}</div>` : "";
  return `<div class="art">${pos}${ph}${img}</div>`;
}

//----- Television collapses to one tile per show, movies never group
function group(list) {
  const out = [], shows = new Map();
  for (const t of list) {
    if (t.kind === "tv" && t.show) {
      let g = shows.get(t.show);
      if (!g) { g = { show: t.show, items: [] }; shows.set(t.show, g); out.push(g); }
      g.items.push(t);
    } else {
      out.push({ items: [t] });
    }
  }
  return out;
}

function tile(g, sub) {
  const head = g.items[0];
  const many = g.items.length > 1;
  const name = many ? g.show : label(head);
  const second = many
    ? `<div class="s">${esc(g.items.length)} episodes</div>`
    : (sub ? sub(head) : "");
  const target = many
    ? `data-show="${esc(g.show)}"`
    : `data-id="${esc(head.id)}"`;
  return `<div class="tile" ${target}>
      ${art(head, many ? g.show : null)}
      <div class="tt"><div class="n">${esc(name)}</div>${second}</div>
    </div>`;
}

//----- One delegated listener, so no title text is ever interpolated into JS
document.addEventListener("click", (ev) => {
  const el = ev.target.closest ? ev.target.closest(".tile") : null;
  if (!el) return;
  if (el.dataset.show !== undefined) showList("GROUP", el.dataset.show);
  else if (el.dataset.id !== undefined) showDetail(Number(el.dataset.id));
});

//----- The queue in processing order:  slot holders first and locked, then the numbered order
function encodeSub(t, prog) {
  const p = prog[t.id];
  const bits = [t.encoder_label || t.encoder || t.display_stage || ""];
  if (p && p.eta_s != null) bits.push("eta " + fmtEta(p.eta_s));
  const line = esc(bits.filter(Boolean).join("   "));
  if (p && p.phase) {
    if (p.copied_bytes == null || !p.total_bytes)
      return `<div class="s">${line}</div><div class="s">${esc(p.phase)}</div>`;
    const c = Math.max(0, Math.min(100, 100 * p.copied_bytes / p.total_bytes));
    return `<div class="s">${line}</div>
    <div class="bar"><i style="width:${c}%"></i></div>
    <div class="s">${esc(p.phase)} ${gb(p.copied_bytes)} / ${gb(p.total_bytes)}</div>`;
  }
  if (!p || p.frame == null) return `<div class="s">${line}</div>`;
  if (!p.total_frames) return `<div class="s">${line}</div><div class="s">${num(p.frame)} frames</div>`;
  const w = Math.max(0, Math.min(100, 100 * p.frame / p.total_frames));
  return `<div class="s">${line}</div>
    <div class="bar"><i style="width:${w}%"></i></div>
    <div class="s">${num(p.frame)} / ${num(p.total_frames)} frames</div>`;
}

function queueSub(t) {
  return `<div class="s">${esc(t.display_stage || t.stage)}${
    t.stage === "ROUTED" && (t.encoder_label || t.encoder) ? " - " + esc(t.encoder_label || t.encoder) : ""}</div>`;
}

function queueUnits(list) {
  const units = [], shows = new Map();
  for (const t of list) {
    if (t.locked) { units.push({ items: [t], locked: true }); continue; }
    if (t.kind === "tv" && t.show) {
      let g = shows.get(t.show);
      if (!g) { g = { show: t.show, items: [] }; shows.set(t.show, g); units.push(g); }
      g.items.push(t);
    } else {
      units.push({ items: [t] });
    }
  }
  return units;
}

function queueTile(u, prog) {
  const head = u.items[0];
  const many = u.items.length > 1;
  const name = many ? u.show : label(head);
  const positions = u.items.map(t => t.queue_position).filter(n => n != null);
  const lo = Math.min(...positions), hi = Math.max(...positions);
  const badge = u.locked ? (head.display_stage || head.stage)
    : positions.length === 0 ? "" : lo === hi ? String(lo) : lo + "-" + hi;
  const second = many
    ? `<div class="s">${esc(u.items.length)} episodes</div>`
    : u.locked ? encodeSub(head, prog) : queueSub(head);
  const target = many ? `data-show="${esc(u.show)}"` : `data-id="${esc(head.id)}"`;
  const drag = u.locked ? "" : `draggable="true"`;
  return `<div class="tile${u.locked ? " locked" : ""}" ${target} ${drag}>
      ${art(head, many ? u.show : null, badge)}
      <div class="tt"><div class="n">${esc(name)}</div>${second}</div>
    </div>`;
}

function paintQueue(list, prog) {
  $("n-queue").textContent = list.length;
  //----- the periodic refresh must not rebuild the grid under the pointer mid-drag.
  if (DRAGGING) return;
  const units = queueUnits(list);
  const html = units.length === 0
    ? `<div class="empty">Nothing waiting.</div>`
    : units.map(u => queueTile(u, prog)).join("");
  if (SIG["t-queue"] !== html) { SIG["t-queue"] = html; $("t-queue").innerHTML = html; }
}

//----- Drag to reorder;  the DOM order after the drop is the order posted
const QBOX = $("t-queue");
QBOX.addEventListener("dragstart", (ev) => {
  const el = ev.target.closest ? ev.target.closest(".tile[draggable='true']") : null;
  if (!el) { ev.preventDefault(); return; }
  DRAGGING = el;
  el.classList.add("dragging");
  ev.dataTransfer.effectAllowed = "move";
  try { ev.dataTransfer.setData("text/plain", el.dataset.id || el.dataset.show || ""); } catch (e) {}
});
QBOX.addEventListener("dragover", (ev) => {
  if (!DRAGGING) return;
  const over = ev.target.closest ? ev.target.closest(".tile[draggable='true']") : null;
  if (!over || over === DRAGGING) { if (over) ev.preventDefault(); return; }
  ev.preventDefault();
  ev.dataTransfer.dropEffect = "move";
  const r = over.getBoundingClientRect();
  //----- the tile grid reads left to right, so the pointer's half of the tile decides before or after.
  const before = (ev.clientX - r.left) < r.width / 2;
  if (before) over.before(DRAGGING); else over.after(DRAGGING);
});
QBOX.addEventListener("drop", (ev) => { ev.preventDefault(); });
QBOX.addEventListener("dragend", async () => {
  const el = DRAGGING;
  if (!el) return;
  el.classList.remove("dragging");
  const order = [...QBOX.querySelectorAll(".tile[draggable='true']")].map(t =>
    t.dataset.show !== undefined ? { show: t.dataset.show } : { id: Number(t.dataset.id) });
  DRAGGING = null;
  SIG["t-queue"] = null;
  try {
    const r = await api("/api/queue", { method: "POST", headers: {"Content-Type": "application/json"},
                                        body: JSON.stringify({ order }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); console.warn("reorder refused:", e.error); }
  } catch (e) {}
  refresh();
});

function paint(boxId, countId, list, sub, emptyText) {
  const groups = group(list);
  const html = groups.length === 0
    ? `<div class="empty">${esc(emptyText)}</div>`
    : groups.map(g => tile(g, sub)).join("");
  if (SIG[boxId] !== html) { SIG[boxId] = html; $(boxId).innerHTML = html; }
  $(countId).textContent = list.length;
}

//----- Fetch and redraw
async function refresh() {
  let s;
  try { s = await (await api("/api/status")).json(); }
  catch (e) { return; }

  menuRow($("codec"), codecText(s.settings));
  menuRow($("gpu"), s.gpu.available ? "gpu ready" : "gpu degraded",
          s.gpu.available ? "ok" : "warn");
  menuRow($("encode"), "encode " + gb(s.encode.free_bytes) + " free"
          + (s.encode.separate_filesystem ? "" : " (same fs)"),
          s.encode.separate_filesystem ? "" : "warn");
  menuRow($("libs"), s.libraries_mounted ? "libraries mounted" : "no libraries, comparison off",
          s.libraries_mounted ? "" : "warn");
  pill($("dry"), s.config.DRY_RUN ? "DRY RUN" : "", s.config.DRY_RUN ? "warn" : "");
  $("dry").style.display = s.config.DRY_RUN ? "" : "none";
  authPill(s);

  const prog = s.progress || {};
  let titles;
  try { titles = await (await api("/api/titles")).json(); }
  catch (e) { return; }
  ALL = titles;
  TITLES = {};
  titles.forEach(t => { TITLES[t.id] = t; });

  const inStage = (set) => titles.filter(t => set.includes(t.stage));

  const queued = inStage(QUEUE_STAGES.concat(ENC_STAGES))
    .filter(t => t.queue_position != null)
    .sort((a, b) => a.queue_position - b.queue_position);
  paintQueue(queued, prog);

  paint("t-enc", "n-enc", inStage(ENC_STAGES), (t) => encodeSub(t, prog), "Nothing encoding.");

  paint("t-held", "n-held", titles.filter(t => t.stage === "HELD"),
        (t) => `<div class="s warn">${esc((t.reasons && t.reasons.length > 1)
          ? t.reasons.length + " reasons - " + t.reasons[0].text : (t.reason || "needs a decision"))}</div>`,
        "Nothing is waiting on you.");

  paint("t-ready", "n-ready", inStage(READY_STAGES),
        (t) => `<div class="s">${esc(base(t.output_path) || "ready to collect")}</div>`,
        "Nothing to collect.");

  const q = titles.filter(t => t.stage === "QUARANTINED").length;
  const f = titles.filter(t => t.stage === "FAILED").length;
  $("c-quar").innerHTML = `Quarantined Files: <b>${q}</b>`;
  $("c-fail").innerHTML = `Failed Jobs: <b>${f}</b>`;
  const a = s.audit || {};
  $("c-report").style.display = a.enabled ? "" : "none";
  $("c-scan").style.display = a.enabled && a.running ? "" : "none";
  $("c-scan").innerHTML = `Scanning: <b>${a.done || 0}/${a.total || 0}</b>`;
}

//----- Detail dialog
async function showDetail(id) {
  let t = TITLES[id];
  try { t = await (await api(`/api/titles/${id}`)).json(); } catch (e) {}
  if (!t) return;
  TITLES[id] = t;

  $("det-h").textContent = label(t) + (t.year ? ` (${t.year})` : "");

  const ids = [t.tmdb ? "tmdb " + t.tmdb : "", t.imdb ? "imdb " + t.imdb : "",
               t.tvdb ? "tvdb " + t.tvdb : ""].filter(Boolean).join("   ");
  const files = t.files_gone ? "files gone"
    : t.quarantine_present ? "files quarantined"
    : t.output_present ? "output present" : "source present";
  $("det-head").innerHTML = `${art(t)}
    <div class="meta">
      <div class="big">${esc(label(t))}${t.year ? " (" + esc(t.year) + ")" : ""}</div>
      ${ids ? `<div class="row">${esc(ids)}</div>` : ""}
      <div class="row">${esc(t.display_stage || t.stage)}${
        (t.encoder_label || t.encoder) ? "   " + esc(t.encoder_label || t.encoder) : ""}   ${esc(files)}</div>
      ${(t.reasons && t.reasons.length > 1)
        ? `<div class="row warn">Held for ${t.reasons.length} reasons:</div>` +
          t.reasons.map(r => `<div class="row warn">&bull; ${r.stage ? esc(r.stage.toLowerCase()) + ": " : ""}${esc(r.text)}</div>`).join("")
        : (t.reason ? `<div class="row warn">${esc(t.reason)}</div>` : "")}
      ${t.stage === "FAILED" ? `<div class="row">Force cannot apply: no output was produced, so there is nothing to carry forward.  Retry runs it again.</div>` : ""}
      <div class="row">${esc(t.source_path)}</div>
      ${t.output_path ? `<div class="row">${esc(t.output_path)}</div>` : ""}
      ${(t.probe && t.probe.oshash) ? `<div class="row">oshash ${esc(t.probe.oshash)}</div>` : ""}
    </div>`;

  const hist = (t.history || []).map(e =>
    `<div class="e"><span class="t">${esc(clock(e.at))}</span>
       <span>${esc(e.stage)}</span><span style="color:var(--dim)">${esc(e.detail || "")}</span></div>`
  ).join("");
  $("det-body").innerHTML = identifyPanel(t) + `<div class="hist"><div class="h">Stage history</div>${
    hist || '<div class="empty">No history.</div>'}</div>`;
  idnChanged();

  const acts = [];
  if (t.comparison) acts.push(`<button onclick="showCompare(${t.id})">Compare</button>`);
  if (t.sibling_comparison) acts.push(`<button onclick="showCompare(${t.id},'sibling_comparison')">Compare sibling</button>`);
  if (t.stage === "HELD" || t.stage === "FAILED") {
    if (!t.identification_held) acts.push(`<button onclick="act(${t.id},'retry')">Retry</button>`);
    if (t.forceable) acts.push(`<button onclick="act(${t.id},'override')">Force through</button>`);
    acts.push(`<button class="bad" onclick="act(${t.id},'discard')">Discard</button>`);
  }
  if (t.files_gone) acts.push(`<button class="bad" onclick="act(${t.id},'forget')">Forget</button>`);
  $("det-acts").innerHTML = acts.join("");
  $("det").showModal();
}

function clock(epoch) {
  if (!epoch) return "";
  const d = new Date(epoch * 1000);
  return d.toTimeString().slice(0, 8);
}

//----- Quarantined, failed, and expanded show groups
let LIST_KIND = null, LIST_SHOW = null, LIST_IDS = [], LIST_FREE = [];

function actionable(t) { return t.stage === "HELD" || t.stage === "FAILED"; }

function showList(kind, show) {
  LIST_KIND = kind; LIST_SHOW = show;
  let rows, heading;
  if (kind === "GROUP") {
    rows = ALL.filter(t => t.kind === "tv" && t.show === show);
    heading = show + " - " + rows.length + " episode(s)";
  } else {
    rows = ALL.filter(t => t.stage === kind);
    heading = kind === "QUARANTINED"
      ? "Quarantined files - " + rows.length
      : "Failed jobs - " + rows.length;
  }
  LIST_IDS = rows.filter(actionable).map(t => t.id);
  LIST_FREE = rows.filter(t => actionable(t) && !t.identification_held).map(t => t.id);
  $("lst-h").textContent = heading;

  const idHeld = LIST_IDS.length - LIST_FREE.length;
  $("lst-acts").innerHTML = LIST_IDS.length === 0 ? "" :
    `<span class="lbl">All ${LIST_IDS.length}${idHeld
      ? `, ${idHeld} held at identification take Discard only` : ""}</span>
     ${LIST_FREE.length ? `<button onclick="actAll('retry')">Retry all ${LIST_FREE.length}</button>
     <button onclick="actAll('override')">Force all ${LIST_FREE.length} through</button>` : ""}
     <button class="bad" onclick="actAll('discard')">Discard all</button>`;
  $("lst-acts").style.display = LIST_IDS.length === 0 ? "none" : "";

  $("lst-body").innerHTML = rows.length === 0
    ? '<div class="empty" style="padding:16px">Nothing here.</div>'
    : rows.map(t => `<div class="row">
        <div>
          <div class="nm">${esc(label(t))}${
            t.season != null && t.episode != null ? " - " + episodeCode(t) : ""}</div>
          <div style="font-size:12px;color:var(--dim)">${esc(base(t.source_path))}</div>
          ${t.reason ? `<div class="why">${esc(t.reason)}</div>` : ""}
        </div>
        <div class="btns">
          <button onclick="$('lst').close();showDetail(${t.id})">Details</button>
          ${t.comparison ? `<button onclick="$('lst').close();showCompare(${t.id})">Compare</button>` : ""}
          ${t.sibling_comparison ? `<button onclick="$('lst').close();showCompare(${t.id},'sibling_comparison')">Compare sibling</button>` : ""}
          ${actionable(t) ? `
          ${t.identification_held ? "" : `<button onclick="actRow(${t.id},'retry')">Retry</button>`}
          ${t.forceable ? `<button onclick="actRow(${t.id},'override')">Force through</button>` : ""}
          <button class="bad" onclick="actRow(${t.id},'discard')">Discard</button>` : ""}
        </div>
      </div>`).join("");
  $("lst").showModal();
}

//----- One title, the dialog stays open on the rest of the group
async function actRow(id, action) {
  await decide(id, action);
  await refresh();
  showList(LIST_KIND, LIST_SHOW);
}

//----- The whole group, in sequence, then the dialog has nothing left to show
async function actAll(action) {
  const ids = (action === "discard" ? LIST_IDS : LIST_FREE).slice();
  for (const id of ids) await decide(id, action);
  $("lst").close();
  refresh();
}

//----- Identification, best match or manual entry
const ID_FIELDS = {tv: ["tvdb", "tmdb"], movie: ["tmdb", "imdb"]};
const MANUAL_FIELDS = {
  movie: [["name", "Title", true, 260], ["year", "Year", true, 70],
          ["tmdb", "tmdb id", false, 110], ["imdb", "imdb id", false, 110]],
  tv: [["name", "Show", true, 220], ["year", "Year", true, 70], ["season", "Season", true, 60],
       ["episode", "Episode", true, 60], ["episode_title", "Episode title", true, 220],
       ["tvdb", "tvdb id", false, 110], ["tmdb", "tmdb id", false, 110]],
};
let IDN = null;

function searchReadings(t) {
  const searched = ((t.candidates || {}).searched) || {};
  const readings = (searched.readings && searched.readings.length) ? searched.readings : [searched];
  return readings.filter(r => r.name);
}

function identifyPanel(t) {
  if (!t.identification_held || !ID_FIELDS[t.kind]) { IDN = null; return ""; }
  const c = t.candidates || {};
  const guess = c.guess || [];
  IDN = {id: t.id, kind: t.kind, guess};
  const searched = c.searched || {};
  const readings = searchReadings(t).map(r => `${esc(r.name)}${r.year ? " (" + esc(r.year) + ")" : ""}`);
  let h = `<div class="idn"><div class="h">Identify${readings.length
    ? ` - searched ${readings.join(" or ")} from the ${esc(searched.rung || "ladder")}` : ""}</div>`;
  h += `<div class="h src">Best match</div>`;
  h += guess.length ? guess.map((g, i) => `<label class="opt">
      <input type="radio" name="idn-pick" value="g${i}" ${guess.length === 1 ? "checked" : ""} onchange="idnChanged()">
      <span class="ttl">${esc(g.title)} (${esc(g.year)})</span>
      <span class="ids">${esc(ID_FIELDS[t.kind].map(f => f + " " + g[f]).join("   "))}   ${esc(g.qid)}</span>
    </label>`).join("")
    : `<div class="empty">No complete match found.</div>`;
  if (c.error) h += `<div class="empty">The best match is incomplete, a provider could not be reached: ${esc(c.error)}</div>`;
  h += `<div class="h src">Enter manually</div><label class="opt">
      <input type="radio" name="idn-pick" value="manual" onchange="idnChanged()">
      <span class="man">${MANUAL_FIELDS[t.kind].map(([k, name, required, width]) =>
        `<span>${esc(name)}${required ? "" : " (optional)"}</span>
         <input type="text" id="idn-${k}" style="width:${width}px" oninput="idnManual()">`).join("")}</span>
    </label>`;
  h += `<div class="go"><button id="idn-go" onclick="identify()" disabled>Confirm and force through</button></div></div>`;
  return h;
}

function idnPicked() {
  const picked = document.querySelector('input[name="idn-pick"]:checked');
  return picked ? picked.value : "";
}

function idnValue(key) {
  return (($(`idn-${key}`) || {}).value || "").trim();
}

function idnManualOk() {
  if (!IDN) return false;
  if (!/^(19|20)\d{2}$/.test(idnValue("year"))) return false;
  const required = MANUAL_FIELDS[IDN.kind].filter(f => f[2]).map(f => f[0]);
  if (!required.every(k => idnValue(k))) return false;
  if (IDN.kind === "tv" && !(/^\d+$/.test(idnValue("season")) && /^\d+$/.test(idnValue("episode")))) return false;
  return true;
}

function idnManual() {
  const manual = document.querySelector('input[name="idn-pick"][value="manual"]');
  if (manual) manual.checked = true;
  idnChanged();
}

function idnChanged() {
  const go = $("idn-go");
  if (!go || !IDN) return;
  const picked = idnPicked();
  go.disabled = !(picked.startsWith("g") || (picked === "manual" && idnManualOk()));
}

async function identify() {
  if (!IDN) return;
  const picked = idnPicked();
  let body = null;
  if (picked.startsWith("g")) {
    const g = IDN.guess[Number(picked.slice(1))];
    body = {qid: g.qid, year: String(g.year || "")};
    for (const f of ID_FIELDS[IDN.kind]) body[f] = g[f];
  } else if (picked === "manual" && idnManualOk()) {
    body = {};
    for (const [k] of MANUAL_FIELDS[IDN.kind]) {
      const v = idnValue(k);
      if (v) body[k] = v;
    }
  }
  if (!body) return;
  await decide(IDN.id, "identify", body);
  $("det").close();
  refresh();
}

//----- Comparison table
function cell(v, attribute) {
  if (v === null || v === undefined || v === "") return '<td class="val">-</td>';
  if (v === true) return '<td class="val">yes</td>';
  if (v === false) return '<td class="val">no</td>';
  //----- the one byte-valued attribute in the measured set reads as GB like every other size.
  if (attribute === "size_bytes") return `<td class="val">${esc(gb(v))}</td>`;
  return `<td class="val">${esc(v)}</td>`;
}

async function showCompare(id, key) {
  let t = TITLES[id];
  try { t = await (await api(`/api/titles/${id}`)).json(); } catch (e) {}
  //----- the gate text names the incumbent;  on the pair table that seat is the sibling.
  const pair = key === "sibling_comparison";
  const c = t[key || "comparison"] || {};
  const out = pair ? null : (t.output_probe || null);
  const rows = c.table || [];
  const other = pair ? "sibling" : "incumbent";

  $("cmp-title").textContent = (pair ? "Against the sibling - " : "Comparison - ") + label(t);
  const seat = (text) => pair ? String(text || "").replace(/incumbent/g, "sibling") : (text || "");
  $("cmp-notes").innerHTML = (c.notes || [])
    .map(n => `<div class="note">${esc(seat(n))}</div>`).join("");
  $("cmp-paths").innerHTML = [
    ["incoming", c.incoming_path],
    [other, c.incumbent_path],
    ["published", pair ? null : t.output_path],
  ].filter(([, p]) => p).map(([k, p]) =>
    `<div><strong>${esc(k)}</strong> ${esc(p)}</div>`).join("");

  const head = `<tr><th>Attribute</th><th>Gate</th><th>Incoming</th><th>${pair ? "Sibling" : "Incumbent"}</th>${
    out ? "<th>Published</th>" : ""}</tr>`;
  $("cmp-body").innerHTML = `<table>${head}` + rows.map(r => {
    const tags = [];
    if (r.decided) tags.push('<span class="tag decided">voted here</span>');
    if (!r.gate && r.differs && r.measurable) tags.push('<span class="tag ungated">no gate</span>');
    if (r.gate && !r.measurable) tags.push('<span class="tag">not measurable</span>');
    return `<tr class="${r.decided ? "decided" : (r.differs ? "differs" : "")}">
      <td>${esc(r.label || r.attribute)}${tags.join("")}</td>
      <td class="gate">${r.gate ? "gate " + r.gate : ""}</td>
      ${cell(r.incoming, r.attribute)}${cell(r.incumbent, r.attribute)}${
        out ? cell(out[r.attribute], r.attribute) : ""}
    </tr>`;
  }).join("") + `</table>`;

  const v = c.verdict || "";
  const gates = (c.gates && c.gates.length) ? " at gate " + c.gates.join(", ") : "";
  const reason = seat(c.reason);
  pill($("cmp-verdict"), `${v}${gates}${reason ? " - " + reason : ""}`,
       v === "win" ? "ok" : (v === "loss" ? "bad" : "warn"));
  $("cmp").showModal();
}

//----- Operator actions
async function decide(id, action, extra) {
  const res = await api(`/api/held/${id}/decision`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify(Object.assign({action}, extra || {})),
  });
  if (!res.ok) {
    let text = "";
    try { text = (await res.json()).error || ""; } catch (e) {}
    alert(text || `decision failed (${res.status})`);
  }
}

async function act(id, action) {
  await decide(id, action);
  $("det").close();
  refresh();
}

refresh();
setInterval(refresh, 5000);
