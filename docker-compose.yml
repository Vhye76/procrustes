services:
  procrustes:
    container_name: procrustes
    image: ghcr.io/vhye76/procrustes:latest
    build: .
    restart: unless-stopped

    #----- Container paths, not host paths
    environment:
      PUID: 1000
      PGID: 1000
      RENDER_GID: ${RENDER_GID:?run "stat -c %g /dev/dri/renderD128" on the host and set this in .env}

      MEDIA_ROOT: /media
      MEDIA_ENCODE: /encode
      MEDIA_CONFIG: /config
      LIBRARY_MOVIES: /library/movies
      LIBRARY_TV: /library/tv

      CERT_DIR: /certs
      TLS_CERT_FILE: fullchain.pem
      TLS_KEY_FILE: privkey.pem

      WEB_PORT: 443
      DRY_RUN: 0
      LOG_LEVEL: info

    #----- Host paths come from .env
    volumes:
      - ${MEDIA_ROOT:?set MEDIA_ROOT in .env}:/media
      - ${MEDIA_ENCODE:?set MEDIA_ENCODE in .env}:/encode
      - ${MEDIA_CONFIG:?set MEDIA_CONFIG in .env}:/config
      - ${CERT_PATH:?set CERT_PATH in .env}:/certs:ro
      - ${MOVIES_PATH:?set MOVIES_PATH in .env}:/library/movies:ro
      - ${TV_PATH:?set TV_PATH in .env}:/library/tv:ro

    #----- GPU passthrough
    devices:
      - /dev/dri:/dev/dri

    ports:
      - "443:443"

    #----- Kernel cgroup limits;  the encoder thread count autodetects from the CPU quota
    cpus: ${CONTAINER_CPUS:-8}
    mem_limit: ${CONTAINER_MEM:-16g}

    logging:
      driver: json-file
      options:
        max-size: 50m
        max-file: "3"
